prompt_schema_version: "1.0.0"
handoff_id: "HANDOFF-YYYYMMDD-XXXX"
artifact_type: "architect_review_handoff_prompt"
producer_run:
  source_prompt_id: ""
  source_report_path: ""
  source_commit_hash: ""
  kept_or_blocked: "kept"
  repo_root: ""
inbox_context:
  upstream_inbox_packet_ref: "inbox/packets/PACKET-YYYYMMDD-XXXX.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "green"
  required_consumers:
    - "orchestrator-validator"
  bottom_matter_ref: "inbox/packets/PACKET-YYYYMMDD-XXXX.plan.md#bottom-matter"
  structured_contract_ref: "inbox/structured/PACKET-YYYYMMDD-XXXX.plan.json"
linked_consumers:
  - role: "orchestrator-validator"
    name: "copilot"
    surface: "gh_copilot_p"
    invocation: "gh copilot -p"
auto_consume_policy:
  enabled: true
  mode: "single_consumer"
  next_prompt_must_embed_handoff_context: true
  next_prompt_must_read_source_report: true
  next_prompt_must_read_required_inputs: true
  next_prompt_must_preserve_runtime_truth_contract: true
handoff_goal:
  objective: ""
  why_now: ""
  best_next_slice: ""
decision_space:
  options:
    - option_id: "option-a"
      title: ""
      rationale: ""
      expected_artifacts:
        - ""
    - option_id: "option-b"
      title: ""
      rationale: ""
      expected_artifacts:
        - ""
    - option_id: "option-c"
      title: ""
      rationale: ""
      expected_artifacts:
        - ""
  recommended_option_id: "option-a"
  blocker_or_escalation_path: ""
review_scope:
  repo_root: ""
  allowed_paths:
    - ""
  disallowed_paths:
    - ""
  primary_focus:
    - ""
  anti_goals:
    - ""
required_inputs:
  report_artifacts:
    - ""
  runtime_proof_artifacts:
    - ""
  contract_artifacts:
    - ""
  research_artifacts:
    - ""
review_protocol:
  ordered_steps:
    - ""
  runtime_truth_expectations:
    - ""
  blocker_expectations:
    - ""
  freshness_expectations:
    - ""
  command_evidence_expectations:
    - ""
validation_loop:
  checks:
    - ""
  rerun_policy: ""
expected_outputs:
  review_report_fields:
    - ""
  dispatch_message:
    artifact_path: ""
    target_roles:
      - "orchestrator-validator"
    message_requirements:
      - "Reference the handoff id and the recommended decision option."
      - "Point at both the structured prompt artifact and the markdown companion artifact."
    must_reference_handoff_id: true
    must_reference_recommended_option_id: true
    must_reference_structured_prompt_artifact: true
    must_reference_markdown_companion_artifact: true
  follow_up_prompt_artifact:
    artifact_path: ""
    target_schema_ref: "agent-heavy-run-prompt.schema.json"
    target_template_ref: "agent-heavy-run-prompt.template.yaml"
    must_be_inline_ready: true
    must_preserve_runtime_truth_fields: true
    must_preserve_blocker_fields: true
    must_preserve_freshness_fields: true
    must_preserve_command_evidence_fields: true
  companion_markdown_prompt_artifact:
    artifact_path: ""
    target_template_ref: "prompts/governed-triad-follow-up-prompt.template.md"
    machine_truth_source: "structured_contract_family"
    must_use_front_matter: true
    must_use_bottom_matter_marker: true
    must_be_parent_only: true
    must_reference_structured_prompt_artifact: true
    must_not_replace_structured_contract: true
