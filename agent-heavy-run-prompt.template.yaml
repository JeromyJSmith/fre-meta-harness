prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-YYYYMMDD-XXXX"
target_agent:
  name: "codex"
  surface: "codex_p"
  invocation: "codex -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "HANDOFF-YYYYMMDD-XXXX"
  upstream_inbox_packet_ref: "inbox/packets/PACKET-YYYYMMDD-XXXX.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "green"
  required_consumers:
    - "orchestrator-validator"
  bottom_matter_ref: "inbox/packets/PACKET-YYYYMMDD-XXXX.plan.md#bottom-matter"
  structured_contract_ref: "inbox/structured/PACKET-YYYYMMDD-XXXX.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact runtime-truth claims from the upstream governed handoff."
    - "Keep blocked lanes explicit unless fresh evidence changes the dependency state."
  command_evidence_requirements:
    - "Name every activation and validation command that supports the conclusion."
    - "Pair each command class with artifact evidence in the report."
  agent_extension_request_ref: ""
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "no_intermediate_permission"
mission:
  objective: ""
  repo_scope: ""
  task_scope: ""
current_verified_state:
  facts:
    - ""
    - ""
hard_rules:
  environment:
    - "Use uv for all Python environment, dependency, script, and test execution."
    - "Do not use pip or create ad hoc venv or virtualenv environments unless uv is first proven insufficient."
  safety:
    - "Do not broaden into unrelated capability work."
    - "Keep changes bounded to the declared contract surfaces."
  truthfulness:
    - "No fake green path."
    - "If validation fails, keep the blocked state honest with exact evidence."
allowed_paths:
  paths:
    - ""
disallowed_paths:
  paths:
    - ""
tasks:
  ordered_steps:
    - ""
    - ""
    - ""
validation_loop:
  checks:
    - "Run targeted validators."
    - "Refresh proof artifacts."
    - "Repeat until bounded pass or exact blocker."
  rerun_policy: "Repeat the fix and validate loop until the bounded task passes or the blocker is proven real."
handoff_inputs:
  handoff_artifact_path: ""
  source_report_paths:
    - ""
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the handoff artifact before planning."
    - "Read the source reports named by the handoff artifact."
    - "Preserve runtime-truth, blocker, freshness, and command-evidence structure."
    - "Emit both the structured follow-up artifact and the governed markdown companion artifact."
success_criteria:
  best_case: ""
  acceptable_fallback: ""
report_contract:
  required_fields:
    - "pass or blocked status"
    - "proof artifact path and verification status"
    - "exact evidence used in the conclusion"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "runtime_mode_activated"
    - "runtime_modes_blocked"
    - "activation_artifacts"
    - "observability_artifacts"
    - "completion_tokens_observed"
    - "policy_outcomes_observed"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "activation_commands"
    - "validation_commands"
    - "tool_health_commands"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "markdown_template_ref"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
