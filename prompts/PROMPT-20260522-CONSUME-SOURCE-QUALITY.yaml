prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260522-CSQ1"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "evaluation/subsystem-runner-proof-strengthening-report.json"
  upstream_inbox_packet_ref: "inbox/consuming-layer.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "amber"
  required_consumers:
    - "filesystem-router"
    - "architect"
    - "orchestrator-validator"
    - "research"
  bottom_matter_ref: "inbox/consuming-layer.plan.md#bottom-matter"
  structured_contract_ref: "inbox/consuming-layer.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact parent runtime truth only."
    - "same_host peer_mesh_local and inbox_protocol remain the only active runtime lanes unless fresh proof changes that."
    - "cross_device remains blocked unless authenticated transport is actually proven."
    - "Do not imply that intake_etl, research_harvest, semantic_cartography, wrapper_synthesizer, Pixeltable sync, DuckDB query proof, or child runtime adoption are already active."
  command_evidence_requirements:
    - "Name every source-recut, validation, evidence-strength, and graph-analysis command used."
    - "Pair every substantive claim with exact artifact evidence."
    - "Keep Infranodus truth bounded unless authenticated live proof exists."
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "ask_when_blocked"
mission:
  objective: "Strengthen the parent-owned consume_source_quality lane with narrower source packets, explicit evidence-strength mapping, stronger terminal or frame evidence rules, and exact non-promotion truth."
  repo_scope: "Standalone parent repo only at /Volumes/PixelTable/VW_iTWIN_Bridge/meta"
  task_scope: "Land a parent-owned source-quality slice only. Do not activate new runtime lanes while improving consume evidence quality."
current_verified_state:
  facts:
    - "The subsystem-runner-proof family now exists on disk with contract-to-runner, bounded probe, observability handshake, and strengthening report surfaces."
    - "same_host peer mesh and same_host inbox protocol remain the only active parent runtime lanes."
    - "cross_device peer mesh and inbox protocol remain blocked with exact dependencies."
    - "Intake ETL, research harvest, semantic cartography, and wrapper synthesizer remain designed_not_activated subsystem lanes."
    - "live_infranodus_access remains blocked for live claims; the bounded local substitute remains the strongest honest graph path."
    - "The strongest currently named remaining weak areas are consume_source_quality, pixeltable_duckdb_persistence, and live_infranodus_access."
hard_rules:
  environment:
    - "Stay strictly inside /Volumes/PixelTable/VW_iTWIN_Bridge/meta."
    - "Use uv for Python execution."
    - "Treat external/ as read-only authority surfaces."
    - "Prefer bounded local evidence over remote-provider assumptions."
  safety:
    - "Do not touch the child repo."
    - "Do not activate a subsystem runner or persistence lane unless exact proof is captured in fresh artifacts."
    - "Do not edit app/**, service/**, scripts/watchers/**, or scripts/parent_peer_mesh_runtime.py for this slice."
    - "Do not collapse governance roles, front-door runtime roles, and peer mesh runtime roles."
  truthfulness:
    - "No fake green path."
    - "Keep the slice bounded to consume_source_quality unless an exact blocker forces a narrower parent-owned fallback."
    - "If source quality improves only structurally and not evidentially, say so plainly."
allowed_paths:
  paths:
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "GOAL.md"
    - "GOLDENPATH.md"
    - "MEMORY.md"
    - "program.md"
    - "library.yaml"
    - "agentics-library.md"
    - "contracts/**"
    - "schemas/**"
    - "examples/**"
    - "expected-failures/**"
    - "tests/**"
    - "evaluation/**"
    - "promotion/**"
    - "prompts/**"
    - "runs/**"
    - "source/**"
    - "inbox/**"
    - "scripts/build-parent-infranodus-artifacts.py"
    - "scripts/score-parent-wrapper.py"
disallowed_paths:
  paths:
    - "external/**"
    - "app/**"
    - "service/**"
    - "scripts/watchers/**"
    - "scripts/parent_peer_mesh_runtime.py"
    - "../VW_iTwin_Bridge/**"
tasks:
  ordered_steps:
    - "Read evaluation/subsystem-runner-proof-strengthening-report.json first and treat it as the current strengthening authority."
    - "Then read evaluation/gap-map-strength-report.json, evaluation/research/compiled/source-index.json, inbox/transcribe.consume/file-system-consume.md, inbox/transcribe.consume/prompt-candidate-consumption.md, and any consume-layer packets that feed promoted claims."
    - "Refresh the bounded InfraNodus artifacts with uv run python scripts/build-parent-infranodus-artifacts.py and keep live MCP blocked unless exact proof exists."
    - "Construct a decision space with option-a consume_source_quality, option-b pixeltable_duckdb_persistence, and option-c live_infranodus_access."
    - "Recommend exactly one option and keep option-a as the default unless exact evidence strongly favors another lane."
    - "If option-a remains best, land only the parent-owned source-quality family: narrower packet boundaries, evidence-strength classes, terminal-or-frame requirements, and do-not-promote rules for transcript-derived claims."
    - "Run at least 4 real proposal and validation iterations unless an exact blocker is proven earlier."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python tests/validate_parent_wrapper_contract.py after each substantive iteration."
    - "Run uv run --isolated --with jsonschema --with pyyaml python scripts/score-parent-wrapper.py --json after each substantive iteration."
    - "Keep evaluation/tool-health/status.json and evaluation/infranodus-* mutually consistent when refreshed."
  rerun_policy: "Perform at least 4 real non-dry bounded iterations unless an exact blocker is proven earlier."
handoff_inputs:
  handoff_artifact_path: "evaluation/subsystem-runner-proof-strengthening-report.json"
  source_report_paths:
    - "evaluation/gap-map-strength-report.json"
    - "evaluation/research/compiled/source-index.json"
    - "evaluation/tool-health/status.json"
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the subsystem-runner-proof strengthening report before planning."
    - "Preserve runtime truth, blocker truth, freshness, and command evidence structure."
    - "Emit both a structured report artifact and a governed markdown companion when the slice completes."
success_criteria:
  best_case: "A parent-owned consume-source-quality family lands cleanly with narrower packet boundaries, evidence-strength rules, stronger source tagging, validator pass, scorer pass, and a truthful next-step prompt."
  acceptable_fallback: "If the full slice cannot land, deliver the strongest partial source-quality family, exact blocker, full decision space, and a truthful report without overclaiming stronger evidence."
report_contract:
  required_fields:
    - "pass or blocked status"
    - "selected workflow-strengthening slice"
    - "decision_space"
    - "recommended_option_id"
    - "iteration_count"
    - "iteration_score_history"
    - "stronger content summary"
    - "still-weak content summary"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "active_parent_runtime_lanes"
    - "blocked_parent_runtime_lanes"
    - "activation_artifacts_used"
    - "non_activated_subsystem_lanes"
    - "do_not_overclaim_notes"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
    - "infranodus_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "validation_commands"
    - "tool_health_commands"
    - "infranodus_commands"
    - "research_commands_or_reads"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
