prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260522-INGEST1"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "contracts/research-packet-manifest.yaml"
  upstream_inbox_packet_ref: "inbox/consuming-layer.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "amber"
  required_consumers:
    - "orchestrator-validator"
    - "research"
    - "architect"
    - "filesystem-router"
    - "intake-mapper"
  bottom_matter_ref: "inbox/consuming-layer.plan.md#bottom-matter"
  structured_contract_ref: "inbox/consuming-layer.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact parent runtime truth only."
    - "same_host peer_mesh_local and inbox_protocol remain the only active runtime lanes unless fresh proof changes that."
    - "cross_device remains blocked unless authenticated transport is actually proven."
    - "Do not imply that intake_etl is live simply because project-intake contracts, scripts, or fixtures exist."
    - "Do not treat transcript-heavy consume packets or compiled derivatives as proof of successful project ingestion without fresh ingest artifacts."
  command_evidence_requirements:
    - "Name every intake, normalization, validation, smoke, route, startup, and scoring command used."
    - "Pair every substantive claim with exact artifact evidence."
    - "If a lane remains blocked, fixture-only, advisory, or non-activated, say so explicitly."
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "ask_when_blocked"
mission:
  objective: "Get the parent repo ready to ingest a real project by hardening the project-intake boundary, normalizing first-project artifacts, adding project-ingest smoke coverage, and producing truthful runbooks and blocked-lane declarations without overclaiming activation."
  repo_scope: "Standalone parent repo only at /Volumes/PixelTable/VW_iTWIN_Bridge/meta"
  task_scope: "Begin with a project-ingest readiness audit, then implement the highest-value parent-owned changes needed so this repo can accept a new project drop, normalize it into governed artifacts, validate it, and report honest readiness for project ingestion."
current_verified_state:
  facts:
    - "The parent repo already has bounded consume-source-quality and compiled-research scripts, but scripts/ingest-consume-sources.py and scripts/refresh-consume-source-quality.py are thin wrappers rather than a full project-intake workflow."
    - "contracts/research-packet-manifest.yaml governs compiled research outputs, but the current contract family does not yet expose an explicit first-project intake manifest or project-drop normalization surface."
    - "source/subsystems/intake-etl.md defines the intended parent-owned wrap boundary for intake ETL, but it explicitly says no intake ETL subsystem runner is activated by the current scaffold."
    - "evaluation/research/compiled/source-index.json already carries evidence-strength rules and promotion boundaries, so source-quality governance exists but project-intake readiness is not yet fully operationalized."
    - "bootstrap.md remains minimal and does not yet describe a first-project ingest flow beyond resolving the active body and starting the operator shell."
    - "tests/ currently appears dominated by a monolithic validator file, which suggests project-intake-specific validation and smoke coverage remain sparse."
    - "app/server.ts exposes a same-host front door with /health, /config.json, and /api/* proxying, but no visible project-intake smoke or route verification surface is evident from the current repo read."
    - "README.md, GOAL.md, program.md, and library.yaml contain overlapping doctrine and runtime guidance, which increases the risk of ingest drift when a real project arrives."
hard_rules:
  environment:
    - "Stay strictly inside /Volumes/PixelTable/VW_iTWIN_Bridge/meta."
    - "Use uv for Python execution."
    - "Prefer repo-relative path discovery and explicit environment resolution over absolute machine-specific paths."
    - "Reuse the current contract and schema families where they fit before adding new ones."
  safety:
    - "Do not touch the child repo."
    - "Do not edit imported upstream authorities under external/."
    - "Do not claim successful project ingestion, live intake ETL, or persistent substrate adoption without exact new evidence."
    - "Keep changes bounded to parent-owned project-intake readiness surfaces, validators, tests, prompts, docs, and evidence artifacts."
  truthfulness:
    - "No fake green path."
    - "If the repo becomes ready for a first governed project drop but not for live autonomous intake, report that distinction clearly."
    - "If a sample fixture is the strongest new proof, keep the lane bounded to sample-fixture or same-host smoke truth."
    - "Treat absent launcher or intake config as findings, not as silently fixed assumptions."
allowed_paths:
  paths:
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "GOAL.md"
    - "GOLDENPATH.md"
    - "MEMORY.md"
    - "program.md"
    - "domain_spec.md"
    - "bootstrap.md"
    - "library.yaml"
    - "package.json"
    - "pyproject.toml"
    - "config.yaml"
    - "body-registry.yaml"
    - "contracts/**"
    - "schemas/**"
    - "examples/**"
    - "expected-failures/**"
    - "tests/**"
    - "evaluation/**"
    - "promotion/**"
    - "prompts/**"
    - "runs/**"
    - "source/**"
    - "inbox/**"
    - "outbox/**"
    - "scripts/**"
    - "app/**"
    - "service/**"
    - ".mcp.json"
disallowed_paths:
  paths:
    - "external/**"
    - "../VW_iTwin_Bridge/**"
tasks:
  ordered_steps:
    - "Start with phase-0 project-ingest readiness review before any edits: inspect the actual intake boundary, project-drop entrypoints, packet normalization path, source-quality gates, startup and route wiring, validator coverage, sample-fixture support, doctrine duplication, and operational runbooks."
    - "Use delegated sub-lanes or sub-agents where available, with at least three workstreams: lane-a project-intake contract plus normalization surfaces, lane-b ingest validation plus runtime and smoke coverage, and lane-c doctrine plus runbooks plus blocked-lane truth."
    - "Write the initial readiness findings first and classify each item as ready, weak, blocked, missing, or misleadingly strong."
    - "Construct a decision space with option-a project_ingest_readiness_tranche, option-b generic_repo_hardening, and option-c persistence_first_for_project_storage."
    - "Recommend exactly one option and keep option-a as the default unless exact evidence strongly favors another lane."
    - "Phase 1 first-project intake boundary: create or refine the parent-owned project-intake contract family needed to accept a new project drop, including a normalized manifest or packet shape, explicit provenance fields, expected compiled destinations, and exact non-activation truth for intake_etl."
    - "Phase 1 must also replace absolute script or launcher paths that affect project-ingest portability, and make the intake entrypoint discoverable through repo-relative resolution and explicit environment discovery."
    - "Phase 2 executable ingest path: turn the current thin ingest wrappers into a clearer bounded flow that can ingest a sample project fixture or project-drop packet into governed artifacts, refresh the right compiled outputs, and emit honest evidence of what was actually processed."
    - "Phase 2 must add a small project-ingest smoke suite that covers app or service startup wiring, at least one route or runtime path, and at least one project-intake happy path plus one blocked path."
    - "Phase 2 must also split or modularize the monolithic parent validator enough that project-intake and contract-family validation can run in clearer isolated lanes."
    - "Phase 3 operator readiness: centralize shared ingest doctrine used by README.md, GOAL.md, program.md, bootstrap.md, and library.yaml into one explicit source-of-truth pattern, add runbooks for local-first project ingestion versus credential-required or blocked extensions, and strengthen tool-health so project-intake-related lanes are either same-host-proven, sample-fixture-proven, or explicitly blocked."
    - "If a root .mcp.json is absent, treat that as a finding and harden the real launcher surfaces that exist instead of inventing a fake path."
    - "Add or refresh exact example artifacts, expected failures, and tests needed so a future operator can hand this repo a project and know what success, weak success, and blocked intake look like."
    - "Run fresh validators, scorer, tool-health refreshes, and project-ingest smoke tests after each substantive phase."
    - "End with a truthful final readiness summary that states whether the parent repo is ready to ingest a first project, ready only for sample-fixture ingestion, or still blocked, and emit the next schema-based follow-up prompt accordingly."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python tests/validate_parent_wrapper_contract.py after each substantive phase or its replacement validator entrypoint if the validator is split."
    - "Run uv run --isolated --with jsonschema --with pyyaml python scripts/score-parent-wrapper.py --json after each substantive phase."
    - "Run the refreshed intake or tool-health path after portability or runtime-truth changes."
    - "Run the new project-ingest smoke or runtime tests after intake, app, service, launcher, or script wiring changes."
    - "If shared ingest doctrine is centralized, verify the touched docs remain mutually consistent and truthful."
  rerun_policy: "Perform a real multi-phase fix-and-validate loop aimed at project-ingest readiness unless an exact blocker makes a later phase impossible."
handoff_inputs:
  handoff_artifact_path: "contracts/research-packet-manifest.yaml"
  source_report_paths:
    - "source/subsystems/intake-etl.md"
    - "bootstrap.md"
    - "scripts/ingest-consume-sources.py"
    - "scripts/refresh-consume-source-quality.py"
    - "scripts/consume_source_quality_lib.py"
    - "evaluation/research/compiled/source-index.json"
    - "contracts/inbox-packet.yaml"
    - "README.md"
    - "program.md"
    - "GOAL.md"
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the ingest boundary, consume scripts, source-quality artifacts, and doctrine files before planning."
    - "Preserve runtime truth, blocker truth, freshness, and command-evidence structure."
    - "Emit both a structured report artifact and a governed markdown companion when the run completes."
    - "Return a schema-based follow-up prompt artifact that is inline-ready for gh copilot -p dispatch."
success_criteria:
  best_case: "The run lands a truthful project-ingest readiness tranche with a first-project intake contract or manifest surface, repo-relative intake entrypoints, sample-fixture or same-host ingest evidence, modular validation, project-ingest smoke coverage, centralized ingest doctrine, clearer runbooks, and refreshed blocked-lane truth."
  acceptable_fallback: "If full first-project readiness cannot land, keep the strongest completed intake boundary, preserve the readiness audit, document exact blockers, leave weak or blocked lanes explicit, and emit the next bounded follow-up prompt without overclaiming ingest readiness."
report_contract:
  required_fields:
    - "pass or blocked status"
    - "initial_project_ingest_readiness_summary"
    - "project_ingest_findings"
    - "recommended_work_order"
    - "decision_space"
    - "recommended_option_id"
    - "phase_1_result"
    - "phase_2_result"
    - "phase_3_result"
    - "delegated_workstreams_used"
    - "project_fixture_or_sample_used"
    - "iteration_count"
    - "iteration_score_history"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "active_parent_runtime_lanes"
    - "blocked_parent_runtime_lanes"
    - "activation_artifacts_used"
    - "project_ingest_lane_changes"
    - "do_not_overclaim_notes"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
    - "project_ingest_test_artifacts"
    - "doc_sync_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "readiness_audit_commands"
    - "validation_commands"
    - "smoke_commands"
    - "project_ingest_commands"
    - "tool_health_commands"
    - "research_commands_or_reads"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "markdown_template_ref"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
