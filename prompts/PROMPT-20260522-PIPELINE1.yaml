prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260522-PIPELINE1"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "contracts/research-packet-manifest.yaml"
  upstream_inbox_packet_ref: "inbox/consuming-layer.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "amber"
  required_consumers:
    - "orchestrator-validator"
    - "research"
    - "architect"
    - "filesystem-router"
    - "intake-mapper"
    - "wrapper-synthesizer"
  bottom_matter_ref: "inbox/consuming-layer.plan.md#bottom-matter"
  structured_contract_ref: "inbox/consuming-layer.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact parent runtime truth only."
    - "same_host peer_mesh_local and inbox_protocol remain the only active runtime lanes unless fresh proof changes that."
    - "cross_device remains blocked unless authenticated transport is actually proven."
    - "Do not imply that intake_etl, research_harvest, semantic_cartography, or wrapper_synthesizer are live simply because new contracts, scripts, or prompts exist."
    - "Do not treat transcript-heavy consume packets, compiled derivatives, or sample fixtures as proof of live multi-project pipeline activation without exact new artifacts."
  command_evidence_requirements:
    - "Name every audit, bootstrap, ingest, compile, smoke, route, startup, validation, and scoring command used."
    - "Pair every substantive claim with exact artifact evidence."
    - "If a lane remains blocked, fixture-only, sample-fixture-only, or advisory, say so explicitly."
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "ask_when_blocked"
mission:
  objective: "Get the parent repo fully ready for the project-ingest pipeline by wiring the workflow end to end: first-project intake contract surfaces, repo-relative bootstrap and entrypoints, executable sample-ingest path, workflow orchestration, smoke coverage, truthful tool-health, and operator runbooks."
  repo_scope: "Standalone parent repo only at /Volumes/PixelTable/VW_iTWIN_Bridge/meta"
  task_scope: "Begin with a pipeline-readiness audit, then land the strongest parent-owned changes needed so a future operator can hand this repo a project, run the documented workflow, produce governed artifacts, and see an honest ready, sample-fixture-ready, or blocked result."
current_verified_state:
  facts:
    - "The parent repo already has bounded consume-source-quality and compiled-research scripts, but scripts/ingest-consume-sources.py and scripts/refresh-consume-source-quality.py are thin wrappers rather than a full pipeline."
    - "contracts/research-packet-manifest.yaml governs compiled research outputs, but there is no clearly established first-project intake manifest or project-drop normalization contract yet."
    - "source/subsystems/intake-etl.md defines the intended wrap boundary for intake ETL, but explicitly states that no intake ETL subsystem runner is activated by the scaffold."
    - "bootstrap.md is minimal and does not yet describe a concrete first-project ingest workflow."
    - "evaluation/research/compiled/source-index.json already encodes evidence-strength and promotion-boundary rules, so source-quality governance exists but pipeline wiring is incomplete."
    - "tests/ is still centered on a monolithic parent validator, so pipeline-specific validation and smoke coverage remain sparse."
    - "app/server.ts exposes same-host front-door routes, but no visible project-ingest smoke path or pipeline route verification surface is evident from the current repo read."
    - "README.md, GOAL.md, program.md, bootstrap.md, and library.yaml contain overlapping doctrine and execution guidance, increasing workflow drift risk."
    - "A root .mcp.json was not found in the current parent repo tree snapshot, so launcher hardening must target the actual startup and workflow surfaces that exist."
hard_rules:
  environment:
    - "Stay strictly inside /Volumes/PixelTable/VW_iTWIN_Bridge/meta."
    - "Use uv for Python execution."
    - "Prefer repo-relative path discovery and explicit environment resolution over absolute machine-specific paths."
    - "Reuse the current contract and schema families where they fit before adding new ones."
  safety:
    - "Do not touch the child repo."
    - "Do not edit imported upstream authorities under external/."
    - "Do not claim successful live project ingestion, live intake ETL, or persistent substrate adoption without exact new evidence."
    - "Keep changes bounded to parent-owned pipeline-readiness surfaces, validators, tests, prompts, docs, scripts, and evidence artifacts."
  truthfulness:
    - "No fake green path."
    - "If the repo becomes ready only for a first governed sample project drop and not for live autonomous intake, report that distinction clearly."
    - "If a sample fixture or same-host smoke is the strongest new proof, keep the lane bounded to that proof class."
    - "Treat absent launcher or pipeline config as findings, not as silently fixed assumptions."
allowed_paths:
  paths:
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "GOAL.md"
    - "GOLDENPATH.md"
    - "MEMORY.md"
    - "program.md"
    - "domain_spec.md"
    - "bootstrap.md"
    - "library.yaml"
    - "package.json"
    - "pyproject.toml"
    - "config.yaml"
    - "body-registry.yaml"
    - "contracts/**"
    - "schemas/**"
    - "examples/**"
    - "expected-failures/**"
    - "tests/**"
    - "evaluation/**"
    - "promotion/**"
    - "prompts/**"
    - "runs/**"
    - "source/**"
    - "inbox/**"
    - "outbox/**"
    - "scripts/**"
    - "app/**"
    - "service/**"
    - ".mcp.json"
disallowed_paths:
  paths:
    - "external/**"
    - "../VW_iTwin_Bridge/**"
tasks:
  ordered_steps:
    - "Start with phase-0 pipeline-readiness review before any edits: inspect the actual project-drop entrypoints, packet normalization path, consume-to-compiled flow, startup and route wiring, validator coverage, fixture support, doctrine duplication, launch surfaces, and operator runbooks."
    - "Use delegated sub-lanes or sub-agents where available, with at least four workstreams: lane-a intake contract plus normalization surfaces, lane-b executable pipeline wiring plus scripts, lane-c validation plus smoke plus route coverage, and lane-d doctrine plus runbooks plus blocked-lane truth."
    - "Write the initial pipeline-readiness findings first and classify each item as ready, weak, blocked, missing, or misleadingly strong."
    - "Construct a decision space with option-a full_pipeline_readiness_tranche, option-b project_ingest_boundary_only, and option-c persistence_first_for_pipeline_storage."
    - "Recommend exactly one option and keep option-a as the default unless exact evidence strongly favors another lane."
    - "Phase 1 pipeline contract and portability layer: create or refine the parent-owned first-project intake contract family needed to accept a project drop, normalize it into governed artifacts, preserve provenance, define expected compiled destinations, and keep exact non-activation truth for intake_etl."
    - "Phase 1 must also replace absolute script or launcher paths that affect pipeline portability, make workflow entrypoints discoverable through repo-relative resolution and explicit environment discovery, and document the actual launcher surfaces if .mcp.json is absent."
    - "Phase 2 executable workflow wiring: turn the current thin ingest wrappers into a clearer bounded pipeline that can ingest a sample project fixture or project-drop packet, refresh the right compiled outputs, emit governed handoffs, and show exactly what artifacts were produced at each step."
    - "Phase 2 must wire the workflow so the operator can run one documented command chain or one documented bootstrap path to drive the first-project pipeline without chat-only glue."
    - "Phase 2 must add a small pipeline smoke suite that covers startup wiring, at least one route or runtime path, one happy-path project intake, one blocked-path project intake, and at least one validation failure mode."
    - "Phase 3 validation, doctrine, and runbooks: split or modularize the monolithic parent validator enough that pipeline-related contract families can be validated in clearer isolated lanes, centralize shared pipeline doctrine used by README.md, GOAL.md, program.md, bootstrap.md, and library.yaml into one explicit source-of-truth pattern, and add operator runbooks for local-first pipeline execution versus credential-required or blocked extensions."
    - "Phase 3 must also strengthen tool-health so project-intake and pipeline lanes are either same-host-proven, sample-fixture-proven, or explicitly blocked with exact dependencies."
    - "Add or refresh exact example artifacts, expected failures, and tests needed so a future operator can hand this repo a project and know what success, weak success, validation failure, and blocked intake look like."
    - "Run fresh validators, scorer, tool-health refreshes, pipeline smoke tests, and workflow checks after each substantive phase."
    - "End with a truthful final readiness summary that states whether the parent repo is ready for the first governed project pipeline, ready only for sample-fixture pipeline execution, or still blocked, and emit the next schema-based follow-up prompt accordingly."
    - "Emit a structured report, a markdown companion, and a schema-based follow-up prompt that returns to the orchestrator-validator flow."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python tests/validate_parent_wrapper_contract.py after each substantive phase or its replacement validator entrypoint if the validator is split."
    - "Run uv run --isolated --with jsonschema --with pyyaml python scripts/score-parent-wrapper.py --json after each substantive phase."
    - "Run the refreshed intake or tool-health path after portability or runtime-truth changes."
    - "Run the new pipeline smoke or runtime tests after intake, app, service, launcher, or script wiring changes."
    - "If shared pipeline doctrine is centralized, verify the touched docs remain mutually consistent and truthful."
  rerun_policy: "Perform a real multi-phase fix-and-validate loop aimed at full project pipeline readiness unless an exact blocker makes a later phase impossible."
handoff_inputs:
  handoff_artifact_path: "contracts/research-packet-manifest.yaml"
  source_report_paths:
    - "source/subsystems/intake-etl.md"
    - "bootstrap.md"
    - "scripts/ingest-consume-sources.py"
    - "scripts/refresh-consume-source-quality.py"
    - "scripts/consume_source_quality_lib.py"
    - "scripts/extract-consume-source-quality.py"
    - "scripts/compile-operational-feature-matrix.py"
    - "evaluation/research/compiled/source-index.json"
    - "contracts/inbox-packet.yaml"
    - "README.md"
    - "program.md"
    - "GOAL.md"
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the ingest boundary, consume scripts, source-quality artifacts, and doctrine files before planning."
    - "Preserve runtime truth, blocker truth, freshness, and command-evidence structure."
    - "Emit both a structured report artifact and a governed markdown companion when the run completes."
    - "Return a schema-based follow-up prompt artifact that is inline-ready for gh copilot -p dispatch."
success_criteria:
  best_case: "The run lands a truthful pipeline-readiness tranche with a first-project intake contract or manifest surface, repo-relative workflow entrypoints, documented executable pipeline wiring, sample-fixture or same-host ingest evidence, modular validation, pipeline smoke coverage, centralized pipeline doctrine, clearer runbooks, and refreshed blocked-lane truth."
  acceptable_fallback: "If full first-project pipeline readiness cannot land, keep the strongest completed boundary and workflow wiring, preserve the readiness audit, document exact blockers, leave weak or blocked lanes explicit, and emit the next bounded follow-up prompt without overclaiming pipeline readiness."
report_contract:
  required_fields:
    - "pass or blocked status"
    - "initial_pipeline_readiness_summary"
    - "pipeline_readiness_findings"
    - "recommended_work_order"
    - "decision_space"
    - "recommended_option_id"
    - "phase_1_result"
    - "phase_2_result"
    - "phase_3_result"
    - "delegated_workstreams_used"
    - "project_fixture_or_sample_used"
    - "workflow_entrypoints_added_or_refined"
    - "iteration_count"
    - "iteration_score_history"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "active_parent_runtime_lanes"
    - "blocked_parent_runtime_lanes"
    - "activation_artifacts_used"
    - "project_pipeline_lane_changes"
    - "do_not_overclaim_notes"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
    - "project_pipeline_test_artifacts"
    - "doc_sync_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "readiness_audit_commands"
    - "validation_commands"
    - "smoke_commands"
    - "project_ingest_commands"
    - "workflow_commands"
    - "tool_health_commands"
    - "research_commands_or_reads"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "markdown_template_ref"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
