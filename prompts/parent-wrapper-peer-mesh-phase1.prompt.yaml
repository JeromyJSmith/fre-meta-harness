    - "Make the communication contracts explicit about the core runtime primitives: list_agents, send_command, send_prompt, await_response, message correlation IDs, explicit completion tokens, retry or escalation boundaries, same-host mode, cross-device mode, and runtime actor roles."
    - "Make the observability and policy contracts explicit about event ingestion and safety boundaries: lifecycle event types, message send and receive events, policy decision outcomes allow or block or ask, prod-to-dev redaction boundary, and peer-swimlane observability expectations."
    - "Update tests/validate_parent_wrapper_contract.py and scripts/score-parent-wrapper.py so they validate minimum required invariants and extensible contract truth, not closed-world exact sets. The validator may require specific required fields and required capabilities, but it must not fail simply because additional valid capabilities, roles, hooks, or improved tool-health states exist."
    - "Add truthful valid and invalid examples for the new communication contract family and register any expected failures needed for the validator."
    - "Refresh only the minimum supporting docs needed so the new communication surfaces are discoverable from the parent wrapper, and keep the explanation focused on this Phase 1 slice."
    - "Run validation, scorer, and git diff hygiene. If the slice is kept, refresh evaluation and promotion artifacts and append exactly one compact iteration row describing this kept communication slice. If it is blocked, preserve the blocked state honestly with exact evidence."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python /Volumes/PixelTable/VW_iTwin_Bridge/meta/tests/validate_parent_wrapper_contract.py"
    - "Run uv run --isolated --with jsonschema --with pyyaml python /Volumes/PixelTable/VW_iTwin_Bridge/meta/scripts/score-parent-wrapper.py --json"
    - "Validate any new examples against their new schemas."
    - "Run git --no-pager diff --check from /Volumes/PixelTable/VW_iTwin_Bridge/meta"
    - "Treat evaluation/validation-report.json, evaluation/metrics-latest.json, promotion/readiness.json, and runs/iterations.jsonl as the primary durable proof surfaces if the slice is kept."
  rerun_policy: "Repeat the bounded fix and validate loop until the communication slice passes honestly or the blocker is exact and proven. Do not broaden into the next absorption wave during this run."
success_criteria:
  best_case: "The parent wrapper gains explicit governed communication, lifecycle, observability-event, and policy-decision surfaces; the validator and scorer accept extensible invariant-based truth instead of brittle exact sets; examples and proof artifacts validate cleanly; and one kept iteration records the first real communication slice."
  acceptable_fallback: "An exact blocker is proven with fresh validator, scorer, and diff evidence showing why truthful communication-slice adoption cannot proceed yet without violating the parent wrapper doctrine."
