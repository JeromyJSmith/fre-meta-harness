    - "Capture the true baseline by running the parent validator and scorer before changes, and explicitly identify the current brittle exact-set and exact-status checks that must be relaxed."
    - "Implement the first real communication contract family as parent-native governed surfaces. Add or update only the truthful minimum set needed for this slice: contracts/peer-message.yaml, schemas/peer-message.schema.json, contracts/peer-lifecycle.yaml, schemas/peer-lifecycle.schema.json, contracts/observability-event.yaml, schemas/observability-event.schema.json, contracts/policy-decision.yaml, schemas/policy-decision.schema.json, contracts/peer-mesh-runtime.yaml, and schemas/peer-mesh-runtime.schema.json."
