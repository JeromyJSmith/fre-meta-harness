prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260522-CSQ3"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "evaluation/consume-source-quality-strengthening-report.json"
  upstream_inbox_packet_ref: "inbox/consuming-layer.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "amber"
  required_consumers:
    - "filesystem-router"
    - "architect"
    - "orchestrator-validator"
    - "research"
  bottom_matter_ref: "inbox/consuming-layer.plan.md#bottom-matter"
  structured_contract_ref: "inbox/consuming-layer.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact parent runtime truth only."
    - "same_host peer_mesh_local and inbox_protocol remain the only active runtime lanes unless fresh proof changes that."
    - "cross_device remains blocked unless authenticated transport is actually proven."
    - "Do not imply that Pixeltable sync, DuckDB query proof, live InfraNodus access, or child runtime adoption are already active."
  command_evidence_requirements:
    - "Name every schema-validation, compile, policy, and scoring command used."
    - "Pair every substantive claim with exact artifact evidence."
    - "Keep InfraNodus truth bounded unless authenticated live proof exists."
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "ask_when_blocked"
mission:
  objective: "Decide and land the next parent-owned strengthening slice after consume_source_quality, with pixeltable_duckdb_persistence as the default unless exact evidence favors a different weaker lane."
  repo_scope: "Standalone parent repo only at /Volumes/PixelTable/VW_iTWIN_Bridge/meta"
  task_scope: "Choose among pixeltable_duckdb_persistence, live_infranodus_access, and consume_packet_ground_truth_only, then land only the selected bounded slice without activating new runtime lanes unless exact proof is refreshed."
current_verified_state:
  facts:
    - "The consume_source_quality slice now emits a machine-validated operational feature matrix, source-index evidence-strength records, and governed handoff artifacts."
    - "same_host peer mesh and same_host inbox protocol remain the only active parent runtime lanes."
    - "cross_device peer mesh and inbox protocol remain blocked with exact dependencies."
    - "Intake ETL, research harvest, semantic cartography, and wrapper synthesizer remain designed_not_activated subsystem lanes."
    - "live_infranodus_access remains blocked for live claims; the bounded local substitute remains the strongest honest graph path."
    - "pixeltable_duckdb_persistence and live_infranodus_access remain the strongest named weak lanes after this slice."
hard_rules:
  environment:
    - "Stay strictly inside /Volumes/PixelTable/VW_iTWIN_Bridge/meta."
    - "Use uv for Python execution."
    - "Treat external authority surfaces as read-only."
  safety:
    - "Do not touch the child repo."
    - "Do not activate a persistence lane, live graph lane, or cross-device lane unless exact proof is captured in fresh artifacts."
    - "Do not collapse governance roles, front-door runtime roles, and peer mesh runtime roles."
  truthfulness:
    - "No fake green path."
    - "Keep the selected slice bounded and say plainly when a lane stays structurally stronger but still operationally blocked."
allowed_paths:
  paths:
    - "contracts/**"
    - "schemas/**"
    - "examples/**"
    - "expected-failures/**"
    - "tests/**"
    - "evaluation/**"
    - "promotion/**"
    - "prompts/**"
    - "runs/**"
    - "source/**"
    - "inbox/**"
    - "outbox/**"
    - "scripts/**"
disallowed_paths:
  paths:
    - "external/**"
    - "app/**"
    - "service/**"
    - "scripts/watchers/**"
    - "scripts/parent_peer_mesh_runtime.py"
    - "../VW_iTwin_Bridge/**"
tasks:
  ordered_steps:
    - "Read evaluation/consume-source-quality-strengthening-report.json first."
    - "Then read evaluation/tool-packaging-strengthening-report.json, evaluation/subsystem-runner-proof-strengthening-report.json, evaluation/tool-health/status.json, evaluation/tool-health/infranodus-live-probe.json, and the outbox handoff artifacts emitted by the consume_source_quality slice."
    - "Construct a decision space with option-a pixeltable_duckdb_persistence, option-b live_infranodus_access, and option-c consume_packet_ground_truth_only."
    - "Recommend exactly one option and keep option-a as the default unless exact evidence strongly favors a narrower slice."
    - "Land only the selected bounded slice with machine-validated artifacts, exact blocker truth, and refreshed report plus prompt artifacts."
    - "Run at least 4 real proposal and validation iterations unless an exact blocker is proven earlier."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python tests/validate_parent_wrapper_contract.py after each substantive iteration."
    - "Run uv run --isolated --with jsonschema --with pyyaml python scripts/score-parent-wrapper.py --json after each substantive iteration."
    - "Validate any new schema surface and bounded proof artifact before concluding."
  rerun_policy: "Perform at least 4 real non-dry bounded iterations unless an exact blocker is proven earlier."
handoff_inputs:
  handoff_artifact_path: "evaluation/consume-source-quality-strengthening-report.json"
  source_report_paths:
    - "evaluation/tool-packaging-strengthening-report.json"
    - "evaluation/subsystem-runner-proof-strengthening-report.json"
    - "evaluation/tool-health/status.json"
    - "evaluation/tool-health/infranodus-live-probe.json"
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the consume-source-quality strengthening report before planning."
    - "Preserve runtime truth, blocker truth, freshness, and command-evidence structure."
    - "Emit both the structured follow-up artifact and the governed markdown companion artifact."
success_criteria:
  best_case: "A next bounded parent-owned strengthening slice lands cleanly with validator pass, scorer pass, exact artifact paths, and a truthful follow-up prompt."
  acceptable_fallback: "If the full next slice cannot land, deliver the strongest partial package, exact blocker, decision space, validation evidence, and a truthful report without overclaiming runtime activation."
report_contract:
  required_fields:
    - "pass or blocked status"
    - "selected workflow-strengthening slice"
    - "decision_space"
    - "recommended_option_id"
    - "iteration_count"
    - "iteration_score_history"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "active_parent_runtime_lanes"
    - "blocked_parent_runtime_lanes"
    - "activation_artifacts_used"
    - "non_activated_subsystem_lanes"
    - "do_not_overclaim_notes"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
    - "compiled_research_artifacts"
    - "infranodus_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "validation_commands"
    - "schema_validation_commands"
    - "compile_commands"
    - "tool_health_commands"
    - "infranodus_commands"
    - "research_commands_or_reads"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "markdown_template_ref"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
