prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260522-HARDEN1"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "evaluation/tool-health/status.json"
  upstream_inbox_packet_ref: "inbox/consuming-layer.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "amber"
  required_consumers:
    - "orchestrator-validator"
    - "research"
    - "architect"
    - "filesystem-router"
  bottom_matter_ref: "inbox/consuming-layer.plan.md#bottom-matter"
  structured_contract_ref: "inbox/consuming-layer.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact parent runtime truth only."
    - "same_host peer_mesh_local and inbox_protocol remain the only active runtime lanes unless fresh proof changes that."
    - "cross_device remains blocked unless authenticated transport is actually proven."
    - "Do not imply that fixture-only checks, dry agent-eval, or file presence alone prove live runtime health."
  command_evidence_requirements:
    - "Name every probe, validation, smoke, route, startup, and scoring command used."
    - "Pair every substantive claim with exact artifact evidence."
    - "If a lane remains blocked or untested, say so explicitly instead of smoothing it over."
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "ask_when_blocked"
mission:
  objective: "Perform a multi-phase parent-repo hardening run that begins with a repo-health audit, then improves portability, runtime-truth honesty, smoke coverage, testability, maintainability, dependency boundaries, and operational runbooks without overclaiming runtime activation."
  repo_scope: "Standalone parent repo only at /Volumes/PixelTable/VW_iTWIN_Bridge/meta"
  task_scope: "Audit the parent repo health first, identify exact work that needs attention, then implement the three requested hardening phases with delegated sub-lanes and fresh validation evidence."
current_verified_state:
  facts:
    - "program.md and GOAL.md still embed absolute /Volumes/PixelTable/VW_iTwin_Bridge/meta validator and scorer paths, which weakens portability."
    - "scripts/refresh-parent-tool-health.py currently assembles status.json from a mix of direct probes, loaded summaries, and bounded fixture truths, so some reported health is not fully probe-derived."
    - "tests/ currently shows only validate_parent_wrapper_contract.py, which indicates the validator surface is still monolithic and runtime-app test coverage is sparse."
    - "app/server.ts is a lightweight Bun front door with /health, /config.json, and /api/* proxying, but no visible co-located smoke or route tests exist in the parent test surface."
    - "package.json exposes dev and inbox scan commands, but no explicit JS test script is present."
    - "A root .mcp.json was not found in the current parent repo tree snapshot, so launcher-path hardening must inspect the actual launcher surfaces that do exist and document missing ones honestly."
    - "evaluation/tool-health/status.json already distinguishes bounded_pass, dry_pass, blocked, and same-host runtime truths, but several lanes still lean on fixtures, substitutes, or credential-gated exceptions."
    - "README.md, GOAL.md, program.md, and library.yaml carry overlapping doctrine, references, and execution guidance that look partially duplicated."
hard_rules:
  environment:
    - "Stay strictly inside /Volumes/PixelTable/VW_iTWIN_Bridge/meta."
    - "Use uv for Python execution."
    - "Use the existing validator, scorer, and health refresh surfaces before inventing new orchestration paths."
    - "Prefer repo-relative path discovery and environment-variable resolution over absolute machine-specific paths."
  safety:
    - "Do not touch the child repo."
    - "Do not edit imported upstream authorities under external/."
    - "Do not claim live or same-host runtime health unless a fresh probe or explicit blocked declaration supports it."
    - "Keep changes bounded to the parent repo surfaces required for the three phases and the resulting report artifacts."
  truthfulness:
    - "No fake green path."
    - "Do not upgrade a lane from fixture-only, dry, or blocked to pass without exact new evidence."
    - "If a requested hardening slice exposes new debt instead of fully closing it, report that clearly."
    - "Treat missing launcher config, missing tests, and duplicated doctrine as health findings, not as silently fixed assumptions."
allowed_paths:
  paths:
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "GOAL.md"
    - "GOLDENPATH.md"
    - "MEMORY.md"
    - "program.md"
    - "domain_spec.md"
    - "library.yaml"
    - "package.json"
    - "pyproject.toml"
    - "config.yaml"
    - "body-registry.yaml"
    - "contracts/**"
    - "schemas/**"
    - "examples/**"
    - "expected-failures/**"
    - "tests/**"
    - "evaluation/**"
    - "promotion/**"
    - "prompts/**"
    - "runs/**"
    - "source/**"
    - "inbox/**"
    - "outbox/**"
    - "scripts/**"
    - "app/**"
    - "service/**"
    - ".mcp.json"
disallowed_paths:
  paths:
    - "external/**"
    - "../VW_iTwin_Bridge/**"
tasks:
  ordered_steps:
    - "Start with phase-0 health review before any edits: inspect portability, launcher surfaces, startup wiring, tool-health honesty, runtime coverage, test surface, doctrine duplication, dependency boundaries, and operational runbooks."
    - "Use delegated sub-lanes or sub-agents where available, with at least three workstreams: lane-a truth plus portability and MCP or launcher surfaces, lane-b tests plus runtime coverage, and lane-c doctrine plus dependency plus runbook debt."
    - "Write the initial repo-health findings first and classify each item as pass, weak, blocked, missing, or misleadingly strong."
    - "Phase 1 truth plus portability: replace absolute MCP and script paths with repo-relative resolution and explicit environment discovery, refactor scripts/refresh-parent-tool-health.py so every reported status is either directly probe-derived or explicitly blocked, and add a small smoke suite for app MCP wrappers, startup wiring, and at least one route or runtime path."
    - "Phase 2 testability plus maintainability: split tests/validate_parent_wrapper_contract.py into contract-family validators or equivalent clearly separated validator modules, add runtime-app tests around scripts/, launcher surfaces including .mcp.json if it exists or its honest replacement surfaces if it does not, and key app or service runtime modules, and centralize shared doctrine used by README.md, GOAL.md, program.md, and library.yaml into one explicit source-of-truth pattern."
    - "Phase 3 deeper structural debt: reduce the dependency surface by separating provider adapters and optional tooling from the core runtime, expand parent tool-health from fixture-only proofs toward stronger same-host or explicitly declared blocked or live lanes where feasible, and add clearer operational runbooks for local-first versus credential-required paths."
    - "If the root .mcp.json is absent, treat that as a health finding and harden the actual launcher or startup surfaces that exist instead of inventing a fake path."
    - "Keep doctrine changes surgical: reduce duplication while preserving the current parent-only truth and role separation."
    - "Run fresh validators, scorer, and health refreshes after each substantive phase, and add or update targeted smoke or runtime tests when the phase changes those surfaces."
    - "End with a truthful final health summary that states what improved, what remains weak, what is still blocked, and what should be the next bounded follow-up slice."
    - "Emit a structured report, a markdown companion, and a schema-based follow-up prompt that returns to the orchestrator-validator flow."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python tests/validate_parent_wrapper_contract.py after each substantive phase or its replacement validator entrypoint if the validator is split."
    - "Run uv run --isolated --with jsonschema --with pyyaml python scripts/score-parent-wrapper.py --json after each substantive phase."
    - "Run the refreshed parent tool-health path after portability or runtime-truth changes."
    - "Run the new smoke or runtime tests after startup, app, service, launcher, or script wiring changes."
    - "If shared doctrine is centralized, verify the touched docs remain mutually consistent and truthful."
  rerun_policy: "Perform a real multi-phase fix-and-validate loop across the three phases unless an exact blocker makes a later phase impossible."
handoff_inputs:
  handoff_artifact_path: "evaluation/tool-health/status.json"
  source_report_paths:
    - "GOAL.md"
    - "README.md"
    - "program.md"
    - "library.yaml"
    - "scripts/refresh-parent-tool-health.py"
    - "tests/validate_parent_wrapper_contract.py"
    - "package.json"
    - "pyproject.toml"
    - "app/server.ts"
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the health surfaces and doctrine files before planning."
    - "Preserve runtime truth, blocker truth, freshness, and command-evidence structure."
    - "Emit both a structured report artifact and a governed markdown companion when the run completes."
    - "Return a schema-based follow-up prompt artifact that is inline-ready for gh copilot -p dispatch."
success_criteria:
  best_case: "The run lands a truthful repo-health audit plus all three hardening phases with repo-relative portability, probe-derived or explicitly blocked tool-health lanes, smoke coverage for app and startup wiring, split validator families, stronger runtime tests, reduced doctrine duplication, clearer dependency boundaries, clearer runbooks, and refreshed validation evidence."
  acceptable_fallback: "If all three phases cannot land, keep the strongest completed phases, preserve the health audit, document exact blockers, leave blocked or weak lanes explicit, and emit the next bounded follow-up prompt without overclaiming repo health."
report_contract:
  required_fields:
    - "pass or blocked status"
    - "initial_repo_health_summary"
    - "repo_health_findings"
    - "recommended_work_order"
    - "phase_1_result"
    - "phase_2_result"
    - "phase_3_result"
    - "delegated_workstreams_used"
    - "iteration_count"
    - "iteration_score_history"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "active_parent_runtime_lanes"
    - "blocked_parent_runtime_lanes"
    - "activation_artifacts_used"
    - "tool_health_lane_changes"
    - "do_not_overclaim_notes"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
    - "runtime_test_artifacts"
    - "doc_sync_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "health_audit_commands"
    - "validation_commands"
    - "smoke_commands"
    - "runtime_test_commands"
    - "tool_health_commands"
    - "research_commands_or_reads"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "markdown_template_ref"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
