prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260522-CSQ2"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
triad_context:
  acting_role: "orchestrator-validator"
  upstream_handoff_ref: "evaluation/subsystem-runner-proof-strengthening-report.json"
  upstream_inbox_packet_ref: "inbox/consuming-layer.plan.md"
  packet_artifact_type: ".plan.md"
  required_gate_state: "amber"
  required_consumers:
    - "filesystem-router"
    - "architect"
    - "orchestrator-validator"
    - "research"
  bottom_matter_ref: "inbox/consuming-layer.plan.md#bottom-matter"
  structured_contract_ref: "inbox/consuming-layer.plan.json"
  decision_space_required: true
  runtime_truth_requirements:
    - "Carry forward exact parent runtime truth only."
    - "same_host peer_mesh_local and inbox_protocol remain the only active runtime lanes unless fresh proof changes that."
    - "cross_device remains blocked unless authenticated transport is actually proven."
    - "Do not imply that intake_etl, research_harvest, semantic_cartography, wrapper_synthesizer, Pixeltable sync, DuckDB query proof, or child runtime adoption are already active."
  command_evidence_requirements:
    - "Name every source-consume, extraction, schema-validation, compile, and scoring command used."
    - "Pair every substantive claim with exact artifact evidence."
    - "Keep InfraNodus truth bounded unless authenticated live proof exists."
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "ask_when_blocked"
mission:
  objective: "Strengthen the parent-owned consume_source_quality lane by converting consume inputs into machine-validated source-quality artifacts, operational feature matrix outputs, and exact non-promotion rules without activating new runtime lanes."
  repo_scope: "Standalone parent repo only at /Volumes/PixelTable/VW_iTWIN_Bridge/meta"
  task_scope: "Land a parent-owned source-quality and compiled-research pipeline slice only: operational feature matrix, evidence-strength schema, consume-folder extraction map, compiled-output ingestion map, and idempotent scripts that refresh bounded compiled outputs."
current_verified_state:
  facts:
    - "The subsystem-runner-proof family now exists on disk with contract-to-runner, bounded probe, observability handshake, and strengthening report surfaces."
    - "same_host peer mesh and same_host inbox protocol remain the only active parent runtime lanes."
    - "cross_device peer mesh and inbox protocol remain blocked with exact dependencies."
    - "Intake ETL, research harvest, semantic cartography, and wrapper synthesizer remain designed_not_activated subsystem lanes."
    - "live_infranodus_access remains blocked for live claims; the bounded local substitute remains the strongest honest graph path."
    - "The strongest currently named remaining weak areas are consume_source_quality, pixeltable_duckdb_persistence, and live_infranodus_access."
    - "The existing PROMPT-20260522-CONSUME-SOURCE-QUALITY prompt is directionally correct but not the stricter schema-aligned implementation prompt for this execution tranche."
hard_rules:
  environment:
    - "Stay strictly inside /Volumes/PixelTable/VW_iTWIN_Bridge/meta."
    - "Use uv for Python execution."
    - "Use the existing contract and schema families before adding any new schema surface."
    - "Treat external authority surfaces as read-only."
    - "Prefer bounded local evidence over remote-provider assumptions."
  safety:
    - "Do not touch the child repo."
    - "Do not activate a subsystem runner, persistence lane, or cross-device lane unless exact proof is captured in fresh artifacts."
    - "Do not edit app/**, service/**, scripts/watchers/**, or scripts/parent_peer_mesh_runtime.py for this slice."
    - "Do not collapse governance roles, front-door runtime roles, and peer mesh runtime roles."
    - "Keep changes bounded to consume-source-quality, compiled research outputs, prompt artifacts, schema additions, and supporting idempotent scripts."
  truthfulness:
    - "No fake green path."
    - "Keep the slice bounded to consume_source_quality unless an exact blocker forces a narrower parent-owned fallback."
    - "If source quality improves only structurally and not evidentially, say so plainly."
    - "Separate score-flat artifact strengthening from any real runtime capability improvement."
allowed_paths:
  paths:
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "GOAL.md"
    - "GOLDENPATH.md"
    - "MEMORY.md"
    - "program.md"
    - "domain_spec.md"
    - "library.yaml"
    - "agentics-library.md"
    - "contracts/**"
    - "schemas/**"
    - "examples/**"
    - "expected-failures/**"
    - "tests/**"
    - "evaluation/**"
    - "promotion/**"
    - "prompts/**"
    - "runs/**"
    - "source/**"
    - "inbox/**"
    - "outbox/**"
    - "scripts/**"
disallowed_paths:
  paths:
    - "external/**"
    - "app/**"
    - "service/**"
    - "scripts/watchers/**"
    - "scripts/parent_peer_mesh_runtime.py"
    - "../VW_iTwin_Bridge/**"
tasks:
  ordered_steps:
    - "Read evaluation/subsystem-runner-proof-strengthening-report.json first and treat it as the current strengthening authority."
    - "Then read prompts/PROMPT-20260522-CONSUME-SOURCE-QUALITY.yaml, prompts/PROMPT-20260522-CONSUME-SOURCE-QUALITY.md, evaluation/gap-map-strength-report.json, evaluation/tool-packaging-strengthening-report.json, evaluation/research/compiled/source-index.json, evaluation/research/compiled/feature-matrix.json, evaluation/research/compiled/capability-harvest.json, evaluation/research/compiled/gap-placement-map.json, and the consume-layer inbox packets that feed promoted claims."
    - "Construct a decision space with option-a consume_source_quality full pipeline, option-b evidence_strength_normalization_only, and option-c compiled_output_ingestion_mapping_only."
    - "Recommend exactly one option and keep option-a as the default unless exact evidence strongly favors a narrower slice."
    - "If option-a remains best, land exact parent-owned artifacts for operational feature matrix output, capability-matrix extension guidance, evidence-strength schema, consume-folder extraction mapping, compiled-output ingestion mapping, and exact do-not-promote rules for transcript-derived workflow claims."
    - "Implement or refresh idempotent scripts under scripts/ that perform ingest, extract, operational matrix compile, policy gate check, and compiled-output refresh for the consume inputs."
    - "Emit or refresh exact artifacts at outbox/2026-05-22-operational-feature-matrix.handoff.md, outbox/2026-05-22-capability-matrix-extension.handoff.md, outbox/2026-05-22-consume-folder-extraction-map.handoff.md, schemas/operational-feature-matrix.schema.json, schemas/evidence-strength.schema.json, evaluation/research/compiled/feature-matrix.json, evaluation/research/compiled/capability-harvest.json, evaluation/research/compiled/gap-placement-map.json, and evaluation/research/compiled/source-index.json."
    - "Refresh the bounded InfraNodus artifacts only if the revised source-quality topology materially changes the local graph analysis inputs, and keep live MCP blocked unless exact proof exists."
    - "Run at least 4 real proposal and validation iterations unless an exact blocker is proven earlier."
    - "End by emitting a structured slice report, a governed markdown companion, and a schema-based follow-up prompt that returns to the orchestrator-validator flow without overclaiming runtime activation."
validation_loop:
  checks:
    - "Run uv run --isolated --with jsonschema --with pyyaml python tests/validate_parent_wrapper_contract.py after each substantive iteration."
    - "Run uv run --isolated --with jsonschema --with pyyaml python scripts/score-parent-wrapper.py --json after each substantive iteration."
    - "Validate any new JSON schema surface and compiled output artifact against its schema before concluding."
    - "Keep evaluation/tool-health/status.json, evaluation/research/compiled/*, and any refreshed infranodus artifacts mutually consistent when touched."
  rerun_policy: "Perform at least 4 real non-dry bounded iterations unless an exact blocker is proven earlier."
handoff_inputs:
  handoff_artifact_path: "evaluation/subsystem-runner-proof-strengthening-report.json"
  source_report_paths:
    - "evaluation/gap-map-strength-report.json"
    - "evaluation/tool-packaging-strengthening-report.json"
    - "evaluation/research/compiled/source-index.json"
    - "evaluation/tool-health/status.json"
  required_follow_up_roles:
    - "orchestrator-validator"
    - "research"
    - "architect"
  consumption_requirements:
    - "Read the subsystem-runner-proof strengthening report before planning."
    - "Preserve runtime truth, blocker truth, freshness, and command evidence structure."
    - "Emit both a structured report artifact and a governed markdown companion when the slice completes."
    - "Return a schema-based follow-up prompt artifact that is inline-ready for gh copilot -p dispatch."
success_criteria:
  best_case: "A parent-owned consume-source-quality implementation slice lands cleanly with operational feature matrix outputs, evidence-strength rules, consume-folder extraction mapping, validator pass, scorer pass, exact artifact paths, and a truthful next-step prompt."
  acceptable_fallback: "If the full slice cannot land, deliver the strongest partial source-quality package, exact blocker, decision space, schema additions, validation evidence, and a truthful report without overclaiming stronger evidence or runtime activation."
report_contract:
  required_fields:
    - "pass or blocked status"
    - "selected workflow-strengthening slice"
    - "decision_space"
    - "recommended_option_id"
    - "iteration_count"
    - "iteration_score_history"
    - "operational feature matrix artifact path"
    - "capability matrix extension artifact path"
    - "consume-folder extraction map artifact path"
    - "compiled-output ingestion map"
    - "schema additions"
    - "files changed"
    - "targeted validation results"
  runtime_truth_fields:
    - "runtime_truth_level"
    - "active_parent_runtime_lanes"
    - "blocked_parent_runtime_lanes"
    - "activation_artifacts_used"
    - "non_activated_subsystem_lanes"
    - "do_not_overclaim_notes"
  blocker_fields:
    - "lane_id"
    - "classification"
    - "blocker_dependency"
    - "missing_prerequisites"
    - "evidence_refs"
  freshness_fields:
    - "artifact_records"
    - "max_artifact_span_seconds"
    - "tool_health_artifacts"
    - "compiled_research_artifacts"
    - "infranodus_artifacts"
  score_saturation_fields:
    - "baseline_total_score"
    - "final_total_score"
    - "score_changed"
    - "why_this_slice_counts"
  command_evidence_fields:
    - "validation_commands"
    - "schema_validation_commands"
    - "compile_commands"
    - "tool_health_commands"
    - "infranodus_commands"
    - "research_commands_or_reads"
  follow_up_prompt_fields:
    - "artifact_path"
    - "target_schema_ref"
    - "target_template_ref"
    - "must_be_inline_ready"
    - "markdown_companion_artifact_path"
    - "markdown_template_ref"
    - "must_use_front_matter"
    - "must_use_bottom_matter_marker"
