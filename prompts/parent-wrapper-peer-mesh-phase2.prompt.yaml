    - "/Volumes/PixelTable/VW_iTwin_Bridge/meta/GOAL.md"
    - "/Volumes/PixelTable/VW_iTwin_Bridge/meta/program.md"
    - "/Volumes/PixelTable/VW_iTwin_Bridge/meta/domain_spec.md"
