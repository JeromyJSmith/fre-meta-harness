prompt_schema_version: "1.0.0"
prompt_id: "PROMPT-20260520-PEERMESH2"
target_agent:
  name: "copilot"
  surface: "gh_copilot_p"
  invocation: "gh copilot -p"
mode:
  execution_style: "heavy_bounded_run"
  autonomy: "high"
  permission_model: "no_intermediate_permission"
mission:
  objective: "Implement the second bounded parent-native peer-mesh slice so the harness gains governed observability ingestion, portable distribution, and measurable regression surfaces on top of the communication contracts."
  repo_scope: "/Volumes/PixelTable/VW_iTwin_Bridge/meta"
  task_scope: "Parent wrapper contracts, schemas, examples, validator/scorer wiring, minimal supporting docs, and refreshed proof artifacts for the Phase 2 observability-distribution-evaluation slice only."
current_verified_state:
  facts:
    - "Parent wrapper root is /Volumes/PixelTable/VW_iTwin_Bridge/meta and prompt artifacts belong under /Volumes/PixelTable/VW_iTwin_Bridge/meta/prompts."
    - "Phase 1 communication work is expected to define or update governed peer-message, peer-lifecycle, observability-event, policy-decision, and peer-mesh-runtime surfaces."
    - "The parent already carries parent-native peer-mesh, agent-role-contract, hook-manifest, and capability-matrix surfaces that may need extension instead of duplication."
    - "The user wants Phase 1 run first and then Phase 2 run second, with explicit file-reading order and bounded adoption."
    - "The Notion packet contains direct parent guidance for hooks mastery, multi-agent observability, the-library distribution, live-bench evaluation, and the corrected layer map tying them together."
    - "The parent worktree is already dirty, so this run must only touch files needed to make observability, distribution, and evaluation materially real at the parent layer."
hard_rules:
  environment:
    - "Use uv for all Python environment, dependency, script, and test execution."
    - "Do not use pip or create ad hoc venv or virtualenv environments unless uv is first proven insufficient."
  safety:
    - "Do not broaden beyond /Volumes/PixelTable/VW_iTwin_Bridge/meta."
    - "Do not edit imported authority clones under /Volumes/PixelTable/VW_iTwin_Bridge/meta/external."
    - "Do not rewrite the child runtime repo, frontend code, or sidecar code in this run."
    - "Do not create parallel observability or library systems outside the existing governed parent wrapper surfaces."
    - "If Phase 1 surfaces are missing or malformed, repair only the minimum prerequisite truth needed for this Phase 2 slice instead of broadening into a full Phase 1 redo."
  truthfulness:
    - "No fake green path."
    - "Do not model observability, distribution, or evaluation as vague prose; represent them as explicit governed parent surfaces."
    - "Do not hardcode a frozen exact list of future capabilities, benchmark groups, or dashboard states when extensible invariant checks can express the contract honestly."
    - "If the slice cannot be kept honestly, stop with an exact blocker and fresh evidence."
